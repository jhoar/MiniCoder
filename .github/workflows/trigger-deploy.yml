name: Deploy Trigger.dev Tasks

on:
  push:
    branches:
      - claude/youthful-maxwell-fr94tp
      - main
    paths:
      - 'packages/triggerdev/**'
      - 'packages/core/**'
      - '.github/workflows/trigger-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: trigger-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tasks:
    name: Validate Task Bundle
    runs-on: ubuntu-latest
    # Scoped to the same environment as deploy-tasks (below) so the registry-topology smoke test
    # reads the DEPLOY_REGISTRY_HOST/DOCKER_REGISTRY_URL values actually configured for this
    # deploy target, not unscoped repository-level defaults.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck triggerdev package
        run: pnpm --filter @minicoder/triggerdev typecheck

      - name: Build triggerdev package
        run: pnpm --filter @minicoder/triggerdev build

      - name: Verify task IDs
        run: |
          node -e "
          const { ALL_TASK_IDS } = require('./packages/triggerdev/dist/task-ids.js');
          const expected = [
            'planning-readiness-assessment',
            'start-clarification',
            'generate-implementation-plan',
            'generate-feature-backlog',
            'activate-approved-backlog',
            'start-next-feature',
            'github-reconciliation',
            'export-plan',
            'export-backlog',
          ];
          const missing = expected.filter(id => !ALL_TASK_IDS.includes(id));
          if (missing.length > 0) {
            console.error('Missing task IDs:', missing);
            process.exit(1);
          }
          console.log('All', ALL_TASK_IDS.length, 'task IDs verified:', ALL_TASK_IDS.join(', '));
          "

      - name: Registry topology smoke test (issue #18)
        # DEPLOY_REGISTRY_HOST (the CLI's push target) and DOCKER_REGISTRY_URL (the supervisor's
        # pull source, from infra/docker-compose.triggerdev.yml) must name the same
        # externally-reachable registry on a GitHub-hosted runner — see docs/04's "CI Registry
        # Setup" section for the full rationale. Catches the two failure modes that otherwise
        # only surface after a "successful" deploy, when the supervisor's runner containers fail
        # to start with an image-not-found error: (1) either var still pointing at the
        # local-dev-only bundled registry default (localhost:5000 / triggerdev-registry:5000),
        # which is unreachable from a GitHub-hosted runner and from a supervisor on a different
        # host; (2) the two vars naming different registry hosts.
        env:
          DEPLOY_REGISTRY_HOST: ${{ vars.DEPLOY_REGISTRY_HOST }}
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          normalize_host() {
            # Strip any scheme (http://, https://) and any path/port suffix, leaving just the
            # registry hostname for comparison.
            echo "$1" | sed -E 's#^[a-zA-Z]+://##' | cut -d/ -f1 | cut -d: -f1
          }

          if [ -z "${DEPLOY_REGISTRY_HOST:-}" ]; then
            fail "DEPLOY_REGISTRY_HOST is not set. A GitHub-hosted runner cannot push to the bundled localhost:5000 registry default — set DEPLOY_REGISTRY_HOST to an externally-reachable registry (see docs/04 'CI Registry Setup')."
          fi
          if [ -z "${DOCKER_REGISTRY_URL:-}" ]; then
            fail "DOCKER_REGISTRY_URL is not set. The supervisor cannot pull from the bundled triggerdev-registry:5000 default when it isn't co-located with a GitHub-hosted runner's push — set DOCKER_REGISTRY_URL to the same registry as DEPLOY_REGISTRY_HOST (see docs/04 'CI Registry Setup')."
          fi

          case "$DEPLOY_REGISTRY_HOST" in
            localhost*|triggerdev-registry*)
              fail "DEPLOY_REGISTRY_HOST=$DEPLOY_REGISTRY_HOST is the local-dev-only bundled registry default, unreachable from a GitHub-hosted runner. Set it to an external registry (ghcr.io, Docker Hub, or a self-hosted registry with a public/VPN-reachable address)."
              ;;
          esac
          case "$DOCKER_REGISTRY_URL" in
            *localhost*|*triggerdev-registry*)
              fail "DOCKER_REGISTRY_URL=$DOCKER_REGISTRY_URL is the local-dev-only bundled registry default. The supervisor pulling from this address will fail unless it is co-located with the same Docker host — set it to the same external registry as DEPLOY_REGISTRY_HOST."
              ;;
          esac

          push_host=$(normalize_host "$DEPLOY_REGISTRY_HOST")
          pull_host=$(normalize_host "$DOCKER_REGISTRY_URL")
          if [ "$push_host" != "$pull_host" ]; then
            fail "Registry topology mismatch: DEPLOY_REGISTRY_HOST resolves to host '$push_host' but DOCKER_REGISTRY_URL resolves to host '$pull_host'. Both must name the same registry so the supervisor can pull what the CLI just pushed."
          fi

          echo "Registry topology OK: both DEPLOY_REGISTRY_HOST and DOCKER_REGISTRY_URL resolve to '$push_host'."

  deploy-tasks:
    name: Deploy to Trigger.dev
    runs-on: ubuntu-latest
    needs: validate-tasks
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      TRIGGER_API_URL: ${{ vars.TRIGGER_API_URL }}
      TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Deploy tasks to Trigger.dev
        working-directory: packages/triggerdev
        # trigger.dev is the official CLI binary (not 'trigger'). --env is explicit so
        # the CLI default (production) is never assumed — staging is the safe default.
        # TRIGGER_API_URL is passed unconditionally via --api-url so the target endpoint
        # is always explicit. For Trigger.dev Cloud set TRIGGER_API_URL=https://api.trigger.dev;
        # for self-host set it to your self-hosted URL. Omitting the var will cause the CLI
        # to error, which is preferable to silently deploying to the wrong endpoint.
        #
        # Registry note: The CLI pushes task images to DEPLOY_REGISTRY_HOST (set in the
        # compose stack's env or .env file). The supervisor pulls from DOCKER_REGISTRY_URL
        # (compose env; defaults to http://triggerdev-registry:5000). For GitHub-hosted runners
        # both must point to the same externally-reachable registry — set DEPLOY_REGISTRY_HOST
        # and DOCKER_REGISTRY_URL in your .env before starting the compose stack. Self-hosted
        # runners co-located with the stack may use the defaults (localhost:5000 / internal).
        run: npx trigger.dev@4.4.6 deploy --env "$DEPLOY_ENV" --api-url "$TRIGGER_API_URL"
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment || 'staging' }}
