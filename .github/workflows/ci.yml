name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      MINICODER_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/minicoder_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minicoder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  migration-validate-sqlite:
    name: Migration Validate (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: /tmp/minicoder-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx packages/migrations/src/runner.ts migrate
      - run: pnpm tsx packages/migrations/src/runner.ts validate

  migration-validate-postgres:
    name: Migration Validate (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: postgres
      DB_URL: postgresql://postgres:postgres@localhost:5432/minicoder_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minicoder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx packages/migrations/src/runner.ts migrate
      - run: pnpm tsx packages/migrations/src/runner.ts validate

  system-test-smoke:
    name: System Test Smoke (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: ":memory:"
      APP_ENV: ci
      NODE_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build @minicoder/testing
        run: pnpm --filter @minicoder/testing build
      - name: Run full testing smoke suite
        run: DB_DIALECT=sqlite DB_PATH=:memory: APP_ENV=ci pnpm vitest run --reporter=verbose packages/testing/src/testing.test.ts

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@f1ba218abb93e405a01d7f5ee6b4b529ba3a2a3b # v3.82.6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
