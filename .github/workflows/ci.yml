name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default: no job needs to write to the repo, open PRs, or otherwise mutate
# GitHub state. Individual jobs may narrow further but none should need to widen this.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  web-build:
    name: Web UI Build
    runs-on: ubuntu-latest
    # `pnpm typecheck` above deliberately excludes packages/web (see CLAUDE.md's "Typecheck
    # Script Ordering" section) — `next build`'s own type-check is the only thing that exercises
    # packages/web's App Router type contracts (e.g. the generated `LayoutConfig<Route>` check),
    # so it needs its own CI job rather than relying on the root typecheck job to cover it.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build @minicoder/web's type dependencies
        run: pnpm --filter @minicoder/core --filter @minicoder/persistence-sqlite --filter @minicoder/persistence-postgres --filter @minicoder/workflow --filter @minicoder/github --filter @minicoder/adapters-coder --filter @minicoder/adapters-reviewer --filter @minicoder/adapters-planner --filter @minicoder/adapters-arbiter --filter @minicoder/triggerdev --filter @minicoder/testing --filter @minicoder/api build
      - run: pnpm --filter @minicoder/web build

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      MINICODER_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/minicoder_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minicoder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  migration-validate-sqlite:
    name: Migration Validate (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: /tmp/minicoder-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx packages/migrations/src/runner.ts migrate
      - run: pnpm tsx packages/migrations/src/runner.ts validate

  migration-validate-postgres:
    name: Migration Validate (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: postgres
      DB_URL: postgresql://postgres:postgres@localhost:5432/minicoder_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minicoder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx packages/migrations/src/runner.ts migrate
      - run: pnpm tsx packages/migrations/src/runner.ts validate

  system-test-smoke:
    name: System Test Smoke (SQLite)
    runs-on: ubuntu-latest
    env:
      DB_DIALECT: sqlite
      DB_PATH: ":memory:"
      APP_ENV: ci
      NODE_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build @minicoder/testing
        run: pnpm --filter @minicoder/testing build
      - name: Run full testing smoke suite
        run: DB_DIALECT=sqlite DB_PATH=:memory: APP_ENV=ci pnpm vitest run --reporter=verbose packages/testing/src/testing.test.ts

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # This job never pushes commits, comments, or otherwise mutates GitHub state, and forked-repo
    # pull requests never receive repository secrets under the default GITHUB_TOKEN permissions
    # model for `pull_request`-triggered workflows — no `pull_request_target` is used here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (pnpm audit)
        # --prod: vite (bundled by vitest) carries one known dev-only high advisory (Windows-only
        # path traversal; irrelevant on this Linux runner and in production) that does not affect
        # runtime — see docs/04 §12.13. Production transitive deps (systeminformation, ws) are
        # patched via pnpm.overrides in package.json. Reproduce locally:
        # `pnpm audit --prod --audit-level=high`.
        run: pnpm audit --prod --audit-level=high
      - name: Dependency audit (OSV Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
      - name: Secret scan (gitleaks)
        # Reproduce locally: `docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect
        # --source /repo --redact -v`. Suppressions require an inline .gitleaksignore entry with a
        # commit-linked rationale, never a blanket rule disable.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: SAST (semgrep)
        # Pinned tool version (image digest) with named, TS/Node.js-appropriate registry rule
        # packs. Reproduce locally: `docker run --rm -v "$PWD:/src" -w /src
        # semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98
        # semgrep scan --config p/security-audit --config p/typescript --error --metrics=off .`
        # False positives are suppressed with an inline `// nosemgrep: <rule-id> -- <reason>`
        # comment, never a blanket rule/path exclusion, so every suppression is reviewed in the PR
        # diff that introduces it.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98 \
            semgrep scan --config p/security-audit --config p/typescript --error --metrics=off .
