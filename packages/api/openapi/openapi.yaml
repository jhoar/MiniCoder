  /workflow-events:
    get:
      operationId: listWorkflowEvents
      parameters:
        - $ref: '#/components/parameters/projectIdQuery'
        - $ref: '#/components/parameters/featureRunIdQuery'
        - $ref: '#/components/parameters/cursor'
