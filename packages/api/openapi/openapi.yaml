  /agent-configurations:
    get:
      operationId: listAgentConfigurations
      parameters:
        - $ref: '#/components/parameters/adapterIdQuery'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK } }
  /review-findings:
    get:
      operationId: listReviewFindings
      parameters:
        - $ref: '#/components/parameters/featureRunIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
