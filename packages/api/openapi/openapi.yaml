      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /artifacts/{id}:
