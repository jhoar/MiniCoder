      operationId: listDisagreements
      parameters:
        - $ref: '#/components/parameters/featureRunIdQuery'
        - $ref: '#/components/parameters/disagreementStateQuery'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK } }
  /policy-decisions:
    get:
      operationId: listPolicyDecisions
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /costs:
    get:
      operationId: listCosts
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /budgets:
    get:
      operationId: listBudgets
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /artifacts:
