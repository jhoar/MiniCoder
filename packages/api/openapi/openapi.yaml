openapi: 3.1.0
info:
  title: MiniCoder Orchestrator API
  version: '14.0.0'
  description: >
    Read endpoints, command endpoints, and GitHub webhook endpoints for the MiniCoder
    Orchestrator (docs/01-system-specification.md §9). Command payload validation is enforced by
    each dispatched core command handler's own Zod schema (packages/core/src/commands/handlers/**)
    — this document's per-command request bodies are intentionally left as a generic object
    schema rather than duplicating those 20+ schemas by hand; this layer's runtime validation
    focuses on route/method/parameter-shape conformance (see CLAUDE.md's Orchestrator API
    Operational Constraints).
servers:
  - url: /
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
    projectIdQuery:
      name: projectId
      in: query
      required: false
      schema: { type: string }
    projectIdQueryRequired:
      name: projectId
      in: query
      required: true
      schema: { type: string }
    adapterIdQuery:
      name: adapterId
      in: query
      required: false
      schema: { type: string }
    featureRunIdQuery:
      name: featureRunId
      in: query
      required: false
      schema: { type: string }
    featureRunIdQueryRequired:
      name: featureRunId
      in: query
      required: true
      schema: { type: string }
    disagreementStateQuery:
      name: state
      in: query
      required: false
      schema: { type: string }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  schemas:
    CommandEnvelopeResponse:
      type: object
      required: [command_id, accepted, resulting_state, emitted_event_ids]
      properties:
        command_id: { type: string }
        accepted: { type: boolean }
        resulting_state: { type: string }
        emitted_event_ids: { type: array, items: { type: string } }
    CommandPayload:
      type: object
      description: Validated by the dispatched command handler's own Zod schema.
    ProblemDetail:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    CursorPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }
security:
  - ApiKeyAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses: { '200': { description: OK } }
  /readyz:
    get:
      operationId: readyz
      security: []
      responses: { '200': { description: OK } }
  /webhooks/github:
    post:
      operationId: githubWebhook
      security: []
      responses: { '200': { description: Accepted } }
  /webhooks/gitea:
    post:
      operationId: giteaWebhook
      security: []
      responses: { '200': { description: Accepted } }
  /webhooks/gitlab:
    post:
      operationId: gitlabWebhook
      security: []
      responses: { '200': { description: Accepted } }
  /commands:
    get:
      operationId: listCommands
      responses: { '200': { description: OK } }
  /commands/{commandSlug}:
    post:
      operationId: dispatchCommand
      parameters:
        - name: commandSlug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200':
          description: Command dispatched
          content:
            application/json: { schema: { $ref: '#/components/schemas/CommandEnvelopeResponse' } }
        '400': { description: Validation error }
        '401': { description: Unauthenticated }
        '403': { description: Not authorized }
        '404': { description: Unknown command }
        '409': { description: Invalid state transition or idempotency conflict }
  /commands/merge-if-ready:
    post:
      operationId: mergeIfReady
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200': { description: Merged }
        '409':
          {
            description: 'Merge gate blocked, merge rejected, or a same-key request is already in progress',
          }
  /commands/finalize-if-github-merged:
    post:
      operationId: finalizeIfGithubMerged
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200': { description: 'Already recorded, or newly recorded after re-verifying with GitHub' }
        '400': { description: 'Validation error, or GitHub does not confirm the PR as merged' }
        '403': { description: Not authorized }
        '404': { description: Feature run not found }
  /commands/repair-design-document-binding:
    post:
      operationId: repairDesignDocumentBinding
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200': { description: 'Binding backfilled, or already bound to the requested document' }
        '400': { description: 'Validation error, or the artifact is already bound to a different document' }
        '403': { description: Not authorized }
        '404': { description: Artifact export or design document not found }
  /commands/register-adapter:
    post:
      operationId: registerAdapter
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200': { description: 'Adapter registered (fresh insert or existing row updated)' }
        '400': { description: 'Validation error, or an unrecognized capability token' }
        '403': { description: Not authorized }
  /commands/request-readiness-assessment:
    post:
      operationId: requestReadinessAssessment
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '202': { description: Enqueued }
        '404': { description: No specification_inputs row exists yet for this project }
  /commands/request-coder-run:
    post:
      operationId: requestCoderRun
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-review:
    post:
      operationId: requestReview
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-fixes:
    post:
      operationId: requestFixes
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/recompute-merge-gate:
    post:
      operationId: recomputeMergeGate
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-design-doc:
    post:
      operationId: requestDesignDoc
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-plan-generation:
    post:
      operationId: requestPlanGeneration
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-backlog-generation:
    post:
      operationId: requestBacklogGeneration
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/request-start-next-feature:
    post:
      operationId: requestStartNextFeature
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '202': { description: Enqueued } }
  /commands/validate:
    post:
      operationId: diagnosticsValidate
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '200': { description: OK } }
  /commands/doctor:
    post:
      operationId: diagnosticsDoctor
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '200': { description: OK } }
  /commands/reconcile:
    post:
      operationId: diagnosticsReconcile
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses:
        '200': { description: OK }
        '400': { description: Validation error or missing Idempotency-Key }
        '409': { description: A same-key reconcile request is already in progress }
  /commands/export-diagnostics:
    post:
      operationId: diagnosticsExport
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandPayload' } } }
      responses: { '200': { description: OK } }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/CursorPage' } } },
          }
  /projects/{id}:
    get:
      operationId: getProject
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /repositories:
    get:
      operationId: listRepositories
      parameters:
        - $ref: '#/components/parameters/projectIdQuery'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK } }
  /github-links:
    get:
      operationId: listGithubLinks
      parameters:
        - $ref: '#/components/parameters/projectIdQuery'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK } }
  /project-acceptance:
    get:
      operationId: getProjectAcceptance
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /specification-inputs:
    get:
      operationId: listSpecificationInputs
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /planning-readiness-assessments:
    get:
      operationId: listPlanningReadinessAssessments
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /planning-readiness-assessments/{id}:
    get:
      operationId: getPlanningReadinessAssessment
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /clarification-sessions:
    get:
      operationId: listClarificationSessions
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
