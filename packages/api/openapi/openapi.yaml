      operationId: listDesignDocuments
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /design-documents/{id}:
    get:
      operationId: getDesignDocument
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
