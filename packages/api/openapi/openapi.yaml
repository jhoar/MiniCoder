  /plans/{id}:
    get:
      operationId: getPlan
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /plans/{id}/sections:
    get:
      operationId: getPlanSections
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /features:
    get:
      operationId: listFeatures
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /features/{id}:
    get:
      operationId: getFeature
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /feature-runs/{id}:
    get:
      operationId: getFeatureRun
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /feature-runs/{featureRunId}/pull-request:
    get:
      operationId: getPullRequestByFeatureRun
      parameters: [{ name: featureRunId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /active-feature:
    get:
      operationId: getActiveFeature
      parameters: [{ $ref: '#/components/parameters/projectIdQueryRequired' }]
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /pull-requests:
    get:
      operationId: listPullRequests
      parameters:
        - $ref: '#/components/parameters/projectIdQueryRequired'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK }, '400': { description: Missing projectId } }
  /agent-runs:
    get:
      operationId: listAgentRuns
      parameters:
        - $ref: '#/components/parameters/projectIdQuery'
        - $ref: '#/components/parameters/featureRunIdQuery'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses: { '200': { description: OK } }
  /agent-runs/{id}:
    get:
      operationId: getAgentRun
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /agent-adapters:
    get:
      operationId: listAgentAdapters
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
