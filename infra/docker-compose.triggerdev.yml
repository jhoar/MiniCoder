version: '3.8'

# MiniCoder — Trigger.dev self-hosted development UI stack (UI-only — no task execution)
#
# This stack ships the Trigger.dev webapp, its Postgres state store, and Redis queue.
# It does NOT include a worker/supervisor, so tasks queued from this environment will
# queue indefinitely and never execute. Use this stack to:
#   - Browse run history via the Trigger.dev webapp (http://localhost:3040)
#   - Inspect DB state during local development
#   - Run `minicoder trigger validate` (static check, no worker required)
#
# TASK EXECUTION requires the worker component. Trigger.dev v4 self-hosting needs a
# materially different architecture (supervisor image, Docker socket proxy, task registry,
# object storage). Follow the official guide before adding a worker:
#   https://github.com/triggerdotdev/trigger.dev/tree/main/hosting/docker
#
# Services:
#   triggerdev-postgres — Trigger.dev state store
#   triggerdev-redis    — Queue / cache (AOF persistence enabled)
#   triggerdev-webapp   — Trigger.dev webapp UI (http://localhost:3040)
#
# Resource sizing (single-node development minimum):
#   postgres: 2 CPU / 1 GB RAM
#   redis:    1 CPU / 512 MB RAM
#   webapp:   2 CPU / 2 GB RAM
#
# Usage:
#   docker compose -f infra/docker-compose.triggerdev.yml up -d
#
# Required env vars (set in .env or via shell):
#   TRIGGER_MAGIC_LINK_SECRET  — random secret for magic-link auth
#   TRIGGER_ENCRYPTION_KEY     — 32-byte hex key for payload encryption
#   TRIGGER_SESSION_SECRET     — random secret for session cookies
#   TRIGGERDEV_WEBHOOK_SECRET  — MiniCoder verifies inbound webhook payloads with this

services:
  triggerdev-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trigger
      POSTGRES_PASSWORD: trigger
      POSTGRES_DB: trigger
    volumes:
      - triggerdev-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trigger']
      interval: 10s
      timeout: 5s
      retries: 5

  triggerdev-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - triggerdev-redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  triggerdev-webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:latest
    restart: unless-stopped
    depends_on:
      triggerdev-postgres:
        condition: service_healthy
      triggerdev-redis:
        condition: service_healthy
    ports:
      - '3040:3000'
    environment:
      DATABASE_URL: postgresql://trigger:trigger@triggerdev-postgres:5432/trigger
      REDIS_TLS_DISABLED: 'true'
      REDIS_HOST: triggerdev-redis
      REDIS_PORT: '6379'
      MAGIC_LINK_SECRET: '${TRIGGER_MAGIC_LINK_SECRET}'
      SESSION_SECRET: '${TRIGGER_SESSION_SECRET}'
      ENCRYPTION_KEY: '${TRIGGER_ENCRYPTION_KEY}'
      # Webhook-secret management: rotate via docs/07-security-and-secrets.md procedure.
      TRIGGER_WEBHOOK_SECRET: '${TRIGGERDEV_WEBHOOK_SECRET:-}'
      LOGIN_ORIGIN: 'http://localhost:3040'
      APP_ORIGIN: 'http://localhost:3040'
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: 'http://triggerdev-webapp:4318'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

volumes:
  triggerdev-postgres-data:
  triggerdev-redis-data:

networks:
  default:
    name: minicoder-triggerdev
