apiVersion: batch/v1
kind: Job
metadata:
  name: minicoder-system-test
  labels:
    app: minicoder
    component: system-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: minicoder
        component: system-test
    spec:
      restartPolicy: Never
      containers:
        - name: system-test
          image: minicoder:latest
          command:
            - node
            - packages/cli/dist/index.js
            - test
            - system
          env:
            - name: DB_DIALECT
              value: sqlite
            - name: DB_PATH
              value: ':memory:'
            - name: APP_ENV
              value: ci
            - name: NODE_ENV
              value: ci
