apiVersion: batch/v1
kind: CronJob
metadata:
  name: minicoder-reconciliation
  labels:
    app: minicoder
    component: reconciliation
spec:
  schedule: '*/30 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: minicoder
            component: reconciliation
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: minicoder:latest
              command:
                - node
                - packages/cli/dist/index.js
                - state
                - reconcile
                - --all
              env:
                - name: DB_DIALECT
                  valueFrom:
                    secretKeyRef:
                      name: minicoder-db-secret
                      key: dialect
                - name: DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: minicoder-db-secret
                      key: url
                - name: APP_ENV
                  value: production
