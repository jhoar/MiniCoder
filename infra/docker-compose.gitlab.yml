version: '3.8'

# MiniCoder — local/CI GitLab fixture (docs/06 §Phase 18 Stage 4).
#
# A single GitLab CE instance for exercising `@minicoder/gitlab`'s `GitlabScmClient` and webhook
# receiver against a real server, mirroring the posture `infra/docker-compose.gitea.yml`/
# `infra/docker-compose.coder-sandbox.yml` already document.
#
# Status: this stack is now brought up in permanent CI (issue #85, `.github/workflows/
# live-scm-matrix.yml`'s `live-gitlab` job — scheduled + `workflow_dispatch`, not on every push;
# see CLAUDE.md's Cross-Dialect Testing section) — `packages/gitlab/src/gitlab-live.
# integration.test.ts` exercises `GitlabScmClient` end to end against it. `packages/gitlab`'s unit
# tests still run against a fake `fetchImpl` for everyday `pnpm test`/local dev (this stack is
# heavy and slow to boot, per the note below), and the Stage 4 "reconciliation fallback is
# primary" acceptance regression (`packages/testing/src/gitlab-reconcile-fallback.test.ts`)
# exercises `reconcileGithubState()` directly against a hand-built `ObservedPullRequestState`, not
# this stack either. The webhook receiver specifically remains untested against this stack in CI —
# real, tracked future work.
#
# GitLab CE is a substantially heavier, slower-starting image than Gitea's (a full Rails
# monolith plus Redis/Postgres/Sidekiq bundled inside one container) — expect several minutes
# before the healthcheck passes, even on capable hardware. This is GitLab's own documented startup
# characteristic, not a MiniCoder-specific issue.
#
# Startup: `docker compose -f infra/docker-compose.gitlab.yml up -d`, wait for the healthcheck
# (this can take several minutes on first boot), then create a personal/project access token and a
# webhook (either through GitLab's web UI at http://localhost:3400, or its API) pointed at a
# `minicoder gitlab serve`/Orchestrator-API instance's `/webhooks/gitlab`, with "Secret token" set
# to the value configured as `GITLAB_WEBHOOK_SECRET`.

services:
  gitlab:
    image: gitlab/gitlab-ce:17.5.2-ce.0
    container_name: minicoder-gitlab-fixture
    hostname: localhost
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:3400'
        gitlab_rails['gitlab_shell_ssh_port'] = 3422
        # Throwaway test fixture — disable outbound mail and background telemetry noise.
        gitlab_rails['gitlab_email_enabled'] = false
        gitlab_rails['usage_ping_enabled'] = false
        prometheus_monitoring['enable'] = false
    # nginx listens internally on whatever port `external_url` specifies (3400 above), not on 80 —
    # a live-verification pass found the original `3400:80` mapping forwarded to a port nothing was
    # listening on. Keep both sides of this mapping equal to `external_url`'s port.
    ports:
      - '3400:3400'
      - '3422:22'
    volumes:
      - minicoder-gitlab-config:/etc/gitlab
      - minicoder-gitlab-logs:/var/log/gitlab
      - minicoder-gitlab-data:/var/opt/gitlab
    shm_size: '256m'
    # Same root cause as the ports comment above, live-verified again here (issue #85): the
    # healthcheck itself curled `http://localhost/-/readiness` (implicit port 80), which — since
    # nginx only listens on whatever port `external_url` specifies — never succeeded, leaving the
    # container permanently "unhealthy"/"starting" even once GitLab was genuinely fully up and
    # serving real requests (confirmed by curling `:3400/-/readiness` from inside the container and
    # getting `{"status":"ok"}` while the port-80 healthcheck was still failing). Keep this in sync
    # with `external_url`'s port, exactly like the `ports:` mapping above.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3400/-/readiness']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

volumes:
  minicoder-gitlab-config:
  minicoder-gitlab-logs:
  minicoder-gitlab-data:
